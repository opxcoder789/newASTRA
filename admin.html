<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASTRA Admin - Product Upload</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .admin-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 32px;
            backdrop-filter: blur(10px);
        }

        .panel h2 {
            font-size: 20px;
            margin-bottom: 24px;
            color: #e07640;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        input[type="email"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.2s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="email"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #e07640;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 3px rgba(224, 118, 64, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        input[type="file"] {
            display: block;
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        input[type="file"]:hover {
            border-color: #e07640;
            background: rgba(224, 118, 64, 0.05);
        }

        .multi-input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .multi-input-group input {
            flex: 1;
        }

        button {
            background: #e07640;
            color: #fff;
            border: none;
            padding: 13px 28px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
            width: 100%;
        }

        button:hover {
            background: #d9642f;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: transparent;
            border: 1px solid #e07640;
            color: #e07640;
        }

        button.secondary:hover {
            background: rgba(224, 118, 64, 0.1);
        }

        .size-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .size-tag {
            background: #e07640;
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .size-tag button {
            background: none;
            border: none;
            color: #000;
            font-size: 16px;
            padding: 0;
            cursor: pointer;
            width: auto;
        }

        .products-list {
            display: grid;
            gap: 16px;
        }

        .product-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .product-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
            flex-shrink: 0;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .product-price {
            color: #e07640;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .product-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        .message {
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 13px;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #e07640;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            flex: 1;
            padding: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .tab.active {
            color: #e07640;
            border-bottom-color: #e07640;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🚀 ASTRA Admin Panel</h1>
            <p>Manage and upload products to your store</p>
        </header>

        <!-- Admin Grid -->
        <div class="admin-grid">
            <!-- Left Panel: Add Product -->
            <div class="panel">
                <h2>Add New Product</h2>
                
                <div id="uploadMessage" class="message"></div>

                <form id="productForm">
                    <div class="form-group">
                        <label>Product Name *</label>
                        <input type="text" id="productName" placeholder="e.g., Brown Jacket" required>
                    </div>

                    <div class="form-group">
                        <label>Price (USD) *</label>
                        <input type="number" id="productPrice" placeholder="149.99" min="0" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="productDescription" placeholder="Product description..."></textarea>
                    </div>

                    <div class="form-group">
                        <label>Category</label>
                        <input type="text" id="productCategory" placeholder="e.g., Jackets, Shoes">
                    </div>

                    <div class="form-group">
                        <label>Image URL or Path</label>
                        <input type="text" id="productImage" placeholder="https://example.com/image.jpg or ../assets/shoe-brown.png">
                        <small style="display: block; margin-top: 6px; color: rgba(255, 255, 255, 0.5); font-size: 12px;">
                            💡 Supports: Full URLs, local paths, or data URLs
                        </small>
                    </div>

                    <div class="form-group">
                        <label>Stock Quantity</label>
                        <input type="number" id="productStock" placeholder="10" min="0" value="0">
                    </div>

                    <div class="form-group">
                        <label>Availability</label>
                        <select id="productAvailability">
                            <option value="In Stock">In Stock</option>
                            <option value="Out of Stock">Out of Stock</option>
                            <option value="Pre-Order">Pre-Order</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Add Size (press Enter to add)</label>
                        <input type="text" id="sizeInput" placeholder="XS, S, M, L, XL, XXL">
                    </div>

                    <div class="size-tags" id="sizeTags"></div>

                    <button type="submit">
                        <span id="submitText">Upload Product</span>
                    </button>
                </form>
            </div>

            <!-- Right Panel: Products List -->
            <div class="panel">
                <h2>Products in Database</h2>
                
                <button class="secondary" id="refreshBtn" style="margin-bottom: 16px;">
                    🔄 Refresh Products
                </button>

                <div id="productsList" class="products-list">
                    <p style="text-align: center; color: rgba(255, 255, 255, 0.5);">Loading products...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@latest/dist/sdk.browser.min.js"></script>
    
    <!-- Config and API -->
    <script src="../backend/config.js"></script>
    <script src="../backend/api.js"></script>

    <!-- Admin Panel Logic -->
    <script>
        const APPWRITE_API_KEY = 'standard_d6ef52384f4c567f907124e81f385f86d5a1b84f45ef54293e355b1f8ac4aa0849cc3d93b66a57b3dd38fcbb0854436af00166631bb5a32c50f4f12f03628414ff4ac9c0dac446d36effaca051a9dcdce6f0bcfdf8397c0caf56bf9150dcf2cdc839618e3a762d3a1d2453e583751ad900ad7bb6c8df745f98e013d6afe5b158';
        
        let sizes = [];

        // Initialize on page load with retry logic
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initializeAppwrite !== 'undefined') {
                initializeAppwrite();
            } else {
                console.warn('initializeAppwrite not yet available, retrying...');
                setTimeout(() => {
                    if (typeof initializeAppwrite !== 'undefined') {
                        initializeAppwrite();
                    }
                    loadProducts();
                    setupEventListeners();
                }, 500);
                return;
            }
            loadProducts();
            setupEventListeners();
        });

        function setupEventListeners() {
            // Size input
            const sizeInput = document.getElementById('sizeInput');
            sizeInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const size = sizeInput.value.trim();
                    if (size && !sizes.includes(size)) {
                        sizes.push(size);
                        renderSizes();
                        sizeInput.value = '';
                    }
                }
            });

            // Product form
            document.getElementById('productForm').addEventListener('submit', uploadProduct);

            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', loadProducts);
        }

        function renderSizes() {
            const tagsContainer = document.getElementById('sizeTags');
            tagsContainer.innerHTML = sizes.map(size => `
                <div class="size-tag">
                    ${size}
                    <button type="button" onclick="removeSize('${size}')">×</button>
                </div>
            `).join('');
        }

        function removeSize(size) {
            sizes = sizes.filter(s => s !== size);
            renderSizes();
        }

        async function uploadProduct(e) {
            e.preventDefault();

            const name = document.getElementById('productName').value;
            const price = parseFloat(document.getElementById('productPrice').value);
            const description = document.getElementById('productDescription').value;
            const category = document.getElementById('productCategory').value;
            const image = document.getElementById('productImage').value;
            const stock = parseInt(document.getElementById('productStock').value) || 0;
            const availability = document.getElementById('productAvailability').value;

            if (!name || !price) {
                showMessage('Please fill in all required fields', 'error');
                return;
            }

            const submitBtn = document.querySelector('#productForm button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Uploading...';

            try {
                // Ensure Appwrite is initialized
                if (!appwriteInitialized || !databases) {
                    initializeAppwrite();
                    if (!databases) {
                        throw new Error('Appwrite initialization failed. Check console for details.');
                    }
                }

                // Use the API function to create product
                const result = await createProduct({
                    name,
                    price,
                    description,
                    category,
                    image,
                    stock,
                    availability,
                    sizes
                });

                showMessage(`✓ Product "${name}" uploaded successfully!`, 'success');
                document.getElementById('productForm').reset();
                sizes = [];
                renderSizes();
                
                // Reload products list
                setTimeout(loadProducts, 1000);

            } catch (error) {
                console.error('Upload error:', error);
                showMessage(`Error: ${error.message}`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span id="submitText">Upload Product</span>';
            }
        }

        async function loadProducts() {
            try {
                const products = await fetchProducts();
                const productsList = document.getElementById('productsList');

                if (!products || products.length === 0) {
                    productsList.innerHTML = '<p style="text-align: center; color: rgba(255, 255, 255, 0.5);">No products yet. Add your first product!</p>';
                    return;
                }

                productsList.innerHTML = products.map(product => `
                    <div class="product-item">
                        <div class="product-image">
                            <img src="${product.image || '../assets/featured-shoe-main.jpg'}" 
                                 alt="${product.name}"
                                 crossorigin="anonymous"
                                 onerror="this.src='../assets/featured-shoe-main.jpg'">
                        </div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                            <div class="product-meta">
                                ${product.category ? `📁 ${product.category}` : ''} 
                                ${product.availability ? `• ${product.availability}` : ''}
                                ${product.stock ? `• Stock: ${product.stock}` : ''}
                            </div>
                            <div class="product-actions">
                                <button class="secondary" onclick="deleteProduct('${product.$id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading products:', error);
                document.getElementById('productsList').innerHTML = `<p style="color: #ef4444;">Error loading products</p>`;
            }
        }

        async function deleteProduct(productId) {
            if (!confirm('Are you sure you want to delete this product?')) return;

            try {
                if (!databases) {
                    initializeAppwrite();
                }

                await databases.deleteDocument(
                    APPWRITE_DATABASE_ID,
                    APPWRITE_PRODUCTS_COLLECTION,
                    productId
                );

                showMessage('Product deleted successfully', 'success');
                loadProducts();

            } catch (error) {
                console.error('Delete error:', error);
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        function showMessage(text, type) {
            const msgEl = document.getElementById('uploadMessage');
            msgEl.textContent = text;
            msgEl.className = `message show ${type}`;
            
            setTimeout(() => msgEl.classList.remove('show'), 4000);
        }
    </script>
</body>
</html>
